name: Deploy Medplum Server (staging)

# Builds the MedaVida Medplum *server* image and pushes it to ECR
# (medavida-medplum), then OPTIONALLY rolls the ECS service onto it.
#
# Why this exists: the MedaVida Medplum fork had no image CI — the server image
# was built by hand and pushed manually, so merging fork changes (custom bots,
# one-off scripts like bootstrap-superadmin, version bumps) never reached
# staging. This closes that gap.
#
# Safety: Medplum is the FHIR store, not a stateless app, so a bad roll is
# disruptive. Therefore BUILD+PUSH is cheap and safe (it only produces an ECR
# artifact and never touches the running service), but the DEPLOY (service roll)
# is **manual + health-gated**: it runs only when you dispatch with
# roll_service=true, and it waits for ECS stability + a green /healthcheck.

on:
  workflow_dispatch:
    inputs:
      roll_service:
        description: "After build, roll the ECS service onto the new image (health-gated)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # Server runtime + the packages bundled into its image.
      - 'packages/server/**'
      - 'packages/core/**'
      - 'packages/ccda/**'
      - 'packages/definitions/**'
      - 'packages/fhir-router/**'
      - '.github/workflows/deploy-medplum-server.yml'
      # NOTE: push only BUILDS+PUSHES the image (no service roll). If upstream
      # syncs make this too chatty, drop the `push:` trigger and build via
      # workflow_dispatch only.

concurrency:
  group: deploy-medplum-server
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC for AWS
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: medavida-medplum

jobs:
  build-push:
    name: Build & push server image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build server + bundled packages
        run: npm run build:fast -- --force

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute tags
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mirror packages/server/scripts/build-docker-server.sh, but single-arch
      # (Fargate runs linux/amd64) so we skip slow arm64 cross-emulation.
      - name: Package server tarballs
        run: |
          tar --no-xattrs -czf medplum-server-metadata.tar.gz \
            package.json package-lock.json \
            packages/bot-layer/package.json packages/ccda/package.json \
            packages/core/package.json packages/definitions/package.json \
            packages/fhir-router/package.json packages/server/package.json
          tar --no-xattrs --exclude='*.ts' --exclude='*.tsbuildinfo' -czf medplum-server-runtime.tar.gz \
            LICENSE.txt NOTICE \
            packages/ccda/dist packages/core/dist packages/definitions/dist \
            packages/fhir-router/dist packages/server/dist

      - name: Build & push image (linux/amd64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:${{ steps.meta.outputs.sha }}" \
            --tag "$IMAGE:latest" \
            --provenance=false \
            --push \
            --progress=plain .
          echo "Pushed $IMAGE:${{ steps.meta.outputs.sha }} (+ :latest)"

  deploy:
    name: Roll ECS service (manual, health-gated)
    needs: build-push
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.roll_service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          CLUSTER=$(aws ecs list-clusters --query 'clusterArns[?contains(@,`medavida`)]|[0]' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service medavida-medplum --force-new-deployment >/dev/null
          echo "Waiting for service to stabilize…"
          aws ecs wait services-stable --cluster "$CLUSTER" --services medavida-medplum

      - name: Health gate
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS "https://medplum.staging.medavida.app/healthcheck" || true)
            echo "healthcheck: $BODY"
            if echo "$BODY" | grep -q '"postgres":true'; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "Medplum did not report healthy after roll" >&2
          exit 1
